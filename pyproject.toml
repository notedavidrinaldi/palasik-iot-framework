[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "palasik"
version = "0.2.0"
description = "PALASIK IoT Zero Trust Event Enforcement Framework"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
  "iot",
  "iot-security",
  "zero-trust",
  "edge-computing",
  "raspberry-pi",
  "mqtt",
  "industrial-iot",
  "python"
]
authors = [
  { name = "David Rinaldi" }
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Internet",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Networking"
]

dependencies = [
  "pyyaml>=6.0",
  "requests>=2.31",
  "paho-mqtt>=1.6"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0"
]

[project.urls]
Homepage = "https://github.com/notedavidrinaldi/palasik-iot-framework"
Repository = "https://github.com/notedavidrinaldi/palasik-iot-framework"
Documentation = "https://notedavidrinaldi.github.io/palasik/"
Issues = "https://github.com/notedavidrinaldi/palasik-iot-framework/issues"
Discussions = "https://github.com/notedavidrinaldi/palasik-iot-framework/discussions"
Changelog = "https://github.com/notedavidrinaldi/palasik-iot-framework/blob/main/CHANGELOG.md"

[project.scripts]
palasik = "palasik.cli.main:main"
demit = "demit.main:main"

[tool.setuptools]
packages = { find = { include = ["palasik*", "demit*"] } }
